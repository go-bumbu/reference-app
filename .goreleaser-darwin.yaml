version: 2
# macOS builds, run on a macOS runner by .github/workflows/release.yml after the
# Linux job created the release; `release.mode: append` adds these zips to it.
builds:
  # =====================================================================================
  # macOS build
  # =====================================================================================
  - id: darwin
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    goamd64:
      - v2
      - v3
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/go-bumbu/reference-app/app/metainfo.Version={{.Version}}
      - -X github.com/go-bumbu/reference-app/app/metainfo.BuildTime={{.Date}}
      - -X github.com/go-bumbu/reference-app/app/metainfo.ShaVer={{.Commit}}
    binary: refapp
    # Pure Go — see .goreleaser.yaml for why CGO is not needed.
    env:
      - CGO_ENABLED=0

archives:
  - formats: [zip]
    name_template: >-
      refapp_
      {{- title .Os  }}_
      {{- if eq .Arch "amd64" }}x86_64_{{ .Amd64 }}
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums_darwin.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  disable: true

release:
  mode: append
