# Lint rules for docs/openapi/*.yaml, run with `make spec-lint`.
extends: ["spectral:oas"]
rules:
  no-hardcoded-api-base:
    description: "A paths key must not hard-code the /api base — that belongs in servers:, so a handler can be remounted under a different prefix without rewriting its paths keys."
    severity: error
    given: "$.paths"
    then: { field: "@key", function: pattern, functionOptions: { notMatch: "^/api(/|$)" } }
  operation-operationId: error
  operation-tags: error
  operation-tag-defined: error
  operation-description: error
