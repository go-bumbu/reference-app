openapi: 3.1.0
info:
  title: reference-app /api/v0 API
  version: 0.1.0
  contact:
    name: Andres Bott
    url: https://github.com/go-bumbu/reference-app
  description: >
    Reference API of the reference-app boilerplate: build information and a
    prototype `notes` resource backed by the `internal/notes` module.


    This document is written by hand (design-first) and is the contract of
    `app/router/api_v0.go`. The tests in `app/router/openapi_test.go` fail when
    a route is missing on either side, or when a response body does not match
    its schema.


    Errors are RFC 9457 problem details (`application/problem+json`). With
    `Env.Production: true` the body is masked: only `type`, `title`, `status`
    and `instance` are returned, without the internal `detail`.


    Authentication is delegated, and selected by the server's `Auth.Method`:
    `none` (every request acts as user `admin` of tenant `default`, for demos)
    or `proxy` (a trusted reverse proxy asserts the user, and optionally the
    tenant, in headers named by `Auth.ProxyHeader`). Operations that answer
    `401` need an authenticated caller. Every note belongs to the caller's
    tenant and is shared by all users of that tenant; another tenant's notes do
    not exist for the caller (`404`).


    Notes are organised by tags: one tree of tags per tenant, where a tag sits
    at the root or under another tag. A note carries any number of tags
    (`Note.tagIds`), and listing the notes of a tag (`GET /notes?tagId=`) lists
    the notes that carry it or any tag below it.


    Jobs are background work the server defines (`GET /jobs`). A run of a job
    works on the caller's tenant only, and its runs, logs and schedules belong
    to that tenant: another tenant's do not exist for the caller (`404`). Run
    and schedule ids are UUID strings, not the 16 hex chars of a note id.
servers:
  - url: /api/v0
    description: >
      Every path below is mount-relative. The base is modelled exclusively
      through this `servers` entry, so bumping the version prefix stays a
      one-line change, with no path or operationId edits.
tags:
  - name: info
    description: Build and runtime information about the server.
  - name: identity
    description: The authenticated caller.
  - name: notes
    description: Prototype resource, backed by the `internal/notes` module and scoped to the caller's tenant.
  - name: tags
    description: >
      The tree of tags that organises the notes of the caller's tenant, owned by
      the `internal/notes` module.
  - name: jobs
    description: >
      Background jobs of the caller's tenant: start a run, follow its progress
      and log, cancel it, and run a job on cron schedules. Backed by the
      `internal/jobs` module.

paths:
  /info:
    get:
      operationId: getInfo
      tags: [info]
      summary: Get build information
      description: >
        Reports the build information baked into the binary at release time
        (via `-ldflags`) and the Go version it was compiled with.
      responses:
        '200':
          description: Build information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'

  /me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Get the caller
      description: >
        Returns the authenticated caller: their user and tenant, created on the
        first request of a new identity.
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /notes:
    get:
      operationId: listNotes
      tags: [notes]
      summary: List notes
      description: >
        Returns the notes of the caller's tenant, newest first. With `tagId`,
        only the notes that carry that tag or any tag below it.
      parameters:
        - name: tagId
          in: query
          required: false
          description: >
            Id of a tag of the caller's tenant. A tag that does not exist (or was
            deleted) matches no note: the list is empty, not an error.
          schema:
            type: integer
            minimum: 1
            maximum: 9223372036854775807
      responses:
        '200':
          description: The notes of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      operationId: createNote
      tags: [notes]
      summary: Create a note
      description: >
        Creates a note in the caller's tenant; the id, the author and the
        creation time are assigned by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '201':
          description: The created note.
          headers:
            Location:
              description: URL of the created note.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Internal'

  /notes/{noteId}:
    parameters:
      - $ref: '#/components/parameters/NoteId'
    get:
      operationId: getNote
      tags: [notes]
      summary: Get a note
      description: Returns a single note of the caller's tenant by id.
      responses:
        '200':
          description: The note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      operationId: updateNote
      tags: [notes]
      summary: Update a note
      description: >
        Replaces the title and body of a note of the caller's tenant. Any user
        of the tenant may edit any of its notes; the id, the author and the
        creation time do not change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '200':
          description: The updated note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      operationId: deleteNote
      tags: [notes]
      summary: Delete a note
      description: >
        Deletes a note of the caller's tenant. Any user of the tenant may
        delete any of its notes.
      responses:
        '204':
          description: The note was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /notes/{noteId}/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/NoteId'
      - $ref: '#/components/parameters/TagId'
    put:
      operationId: addNoteTag
      tags: [notes]
      summary: Tag a note
      description: >
        Gives the note the tag. Idempotent: a note that carries the tag already
        is left as it is. Both must belong to the caller's tenant. The link has
        no representation of its own (no `GET`): read `Note.tagIds`.
      responses:
        '200':
          description: The note, carrying the tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteOrTagNotFound'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      operationId: removeNoteTag
      tags: [notes]
      summary: Untag a note
      description: >
        Takes the tag off the note. Idempotent: a note that does not carry the
        tag is left as it is. Tags below the tag are not touched.
      responses:
        '200':
          description: The note, without the tag.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoteOrTagNotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: Get the tag tree
      description: >
        Returns the tag tree of the caller's tenant: the tags at the root, each
        with its subtree, siblings in the order the users gave them. A tenant
        holds at most 1000 tags, so the tree is never paginated.
      responses:
        '200':
          description: The tag tree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      operationId: createTag
      tags: [tags]
      summary: Create a tag
      description: >
        Creates a tag in the caller's tenant, at the root or under another tag,
        placed first among its siblings or after `afterId`. A tenant that has
        1000 tags already is refused with `422`. A name is unique among its
        siblings, so a retried create whose first attempt went through answers
        `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagInput'
      responses:
        '201':
          description: The created tag.
          headers:
            Location:
              description: URL of the created tag.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/TagNameTaken'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Internal'

  /tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagId'
    patch:
      operationId: updateTag
      tags: [tags]
      summary: Update a tag
      description: >
        Renames a tag, moves it with its subtree under another tag or to the
        root (`parentId`), and/or places it among its siblings (`afterId`). An
        absent field is left as it is; the change is applied whole or not at
        all. A move without `afterId` puts the tag last among its new siblings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagPatch'
      responses:
        '200':
          description: The tag as it is now, with its subtree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TagNameTaken'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      operationId: deleteTag
      tags: [tags]
      summary: Delete a tag
      description: >
        Deletes a tag together with every tag below it, and takes them off the
        notes that carried them. The notes themselves stay.
      responses:
        '204':
          description: The tag and its subtree were deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs
      description: >
        Returns every job the server defines, each with the caller's tenant's
        schedules of it.
      responses:
        '200':
          description: The jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /jobs/{jobName}/runs:
    parameters:
      - $ref: '#/components/parameters/JobName'
    post:
      operationId: runJob
      tags: [jobs]
      summary: Run a job
      description: >
        Queues a run of the job for the caller's tenant. While the tenant has a
        run of the job waiting or running, no second one is queued: the answer
        is `200` with that run instead of `202` with a new one.
      responses:
        '202':
          description: The queued run.
          headers:
            Location:
              description: URL of the run.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRun'
        '200':
          description: The run of the job the tenant already has waiting or running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/QueueFull'
        '500':
          $ref: '#/components/responses/Internal'

  /jobs/{jobName}/schedules:
    parameters:
      - $ref: '#/components/parameters/JobName'
    post:
      operationId: createJobSchedule
      tags: [jobs]
      summary: Schedule a job
      description: >
        Adds a cron schedule that runs the job for the caller's tenant. A
        tenant has at most 5 schedules per job. A fire while the tenant's run
        of the job is still waiting or running is skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobScheduleInput'
      responses:
        '201':
          description: The created schedule.
          headers:
            Location:
              description: URL of the created schedule.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Internal'

  /jobs/{jobName}/schedules/{scheduleId}:
    parameters:
      - $ref: '#/components/parameters/JobName'
      - $ref: '#/components/parameters/ScheduleId'
    patch:
      operationId: updateJobSchedule
      tags: [jobs]
      summary: Change a job schedule
      description: >
        Changes the cron expression or pauses and resumes a schedule; absent
        fields are left as they are.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobSchedulePatch'
      responses:
        '200':
          description: The changed schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      operationId: deleteJobSchedule
      tags: [jobs]
      summary: Delete a job schedule
      description: Deletes the schedule; runs it already queued are not affected.
      responses:
        '204':
          description: The schedule was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /job-runs:
    get:
      operationId: listJobRuns
      tags: [jobs]
      summary: List job runs
      description: >
        Returns the runs of the caller's tenant, newest first: the waiting and
        running ones and the recent history. The server keeps a bounded history
        of finished runs shared by every tenant, so old runs and their logs
        disappear.
      responses:
        '200':
          description: The runs of the caller's tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRunList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/Internal'

  /job-runs/{runId}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getJobRun
      tags: [jobs]
      summary: Get a job run
      description: Returns one run of the caller's tenant, with its progress while it runs.
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRun'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /job-runs/{runId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      operationId: cancelJobRun
      tags: [jobs]
      summary: Cancel a job run
      description: >
        Cancels a waiting run, or stops a running one and waits for it to end.
        A run that already ended is left as it is: the answer is `204` too.
      responses:
        '204':
          description: The run is not waiting or running any more.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /job-runs/{runId}/log:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      operationId: getJobRunLog
      tags: [jobs]
      summary: Get a job run's log
      description: >
        Returns the last lines of the run's log as plain text, one
        `<RFC 3339 time> <LEVEL> <message>` line each, empty before the run
        starts.
      parameters:
        - name: tail
          in: query
          required: false
          description: How many of the last lines to return.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        '200':
          description: The log.
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

components:
  parameters:
    NoteId:
      name: noteId
      in: path
      required: true
      description: Id of the note.
      schema:
        type: string
        maxLength: 64
    TagId:
      name: tagId
      in: path
      required: true
      description: >
        Id of the tag. A value that is not a positive integer names no tag and
        is answered like an unknown id, with `404`.
      schema:
        type: integer
        minimum: 1
        maximum: 9223372036854775807
    JobName:
      name: jobName
      in: path
      required: true
      description: Name of the job (`Job.name`).
      schema:
        type: string
        maxLength: 64
        examples: [scan-notes]
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      description: Id of the schedule.
      schema:
        type: string
        maxLength: 64
    RunId:
      name: runId
      in: path
      required: true
      description: Id of the run.
      schema:
        type: string
        maxLength: 64

  schemas:
    Info:
      type: object
      additionalProperties: false
      required: [version, buildTime, commit, goVersion]
      properties:
        version:
          type: string
          description: Release version, `dev-build` for local builds.
          examples: [v1.2.3]
        buildTime:
          type: string
          description: Build date, `unknown` for local builds.
        commit:
          type: string
          description: Git commit sha of the build, `undefined` for local builds.
        goVersion:
          type: string
          description: Go version the binary was compiled with.
          examples: [go1.27.1]

    NoteInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          description: Leading and trailing whitespace is trimmed; must not be empty afterwards.
          minLength: 1
          maxLength: 200
        body:
          type: string
          maxLength: 10000

    Me:
      type: object
      additionalProperties: false
      required: [userId, subject, tenantId, tenant]
      properties:
        userId:
          type: string
          description: Id of the user, stable for the subject within the tenant.
        subject:
          type: string
          description: The login the authentication method asserted.
          examples: [admin]
        tenantId:
          type: string
          description: Id of the caller's tenant.
        tenant:
          type: string
          description: Slug of the caller's tenant.
          examples: [default]

    Note:
      type: object
      additionalProperties: false
      required: [id, createdBy, title, body, createdAt, tagIds]
      properties:
        id:
          type: string
        createdBy:
          type: string
          description: Id of the user who created the note (see `Me.userId`).
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        tagIds:
          type: array
          description: Ids of the tags the note carries (see `Tag`), ascending.
          uniqueItems: true
          items:
            type: integer
            minimum: 1

    NoteList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Note'

    Tag:
      type: object
      additionalProperties: false
      required: [id, parentId, name, children]
      properties:
        id:
          type: integer
          minimum: 1
        parentId:
          type: integer
          minimum: 0
          description: Id of the tag above it; `0` for a tag at the root.
        name:
          type: string
          description: Unique among the tag's siblings, compared as written (case-sensitive).
        children:
          type: array
          description: The tags directly below it, in order, each with its own subtree.
          items:
            $ref: '#/components/schemas/Tag'

    TagList:
      type: object
      additionalProperties: false
      required: [items]
      examples:
        - items:
            - id: 1
              parentId: 0
              name: work
              children:
                - {id: 3, parentId: 1, name: reports, children: []}
            - {id: 2, parentId: 0, name: home, children: []}
      properties:
        items:
          type: array
          description: The tags at the root, in order, each with its subtree.
          items:
            $ref: '#/components/schemas/Tag'

    TagInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          description: Leading and trailing whitespace is trimmed; must not be empty afterwards.
          minLength: 1
          maxLength: 100
        parentId:
          type: integer
          minimum: 0
          default: 0
          description: Id of the tag to create it under; `0` (or absent) for the root.
        afterId:
          type: integer
          minimum: 0
          default: 0
          description: >
            Id of the sibling to place it after; `0` (or absent) places it
            first. Must be a tag directly under `parentId`.

    TagPatch:
      type: object
      additionalProperties: false
      description: >
        Every field is optional; an absent one is left as it is. This is plain
        JSON, not a merge patch: a `null` field counts as absent, so a move to
        the root is `parentId: 0`.
      properties:
        name:
          type: string
          description: Leading and trailing whitespace is trimmed; must not be empty afterwards.
          minLength: 1
          maxLength: 100
        parentId:
          type: integer
          minimum: 0
          description: >
            Id of the tag to move it under; `0` for the root. Must not be the
            tag itself or one of its descendants.
        afterId:
          type: integer
          minimum: 0
          description: >
            Id of the sibling, under the parent the tag ends up in, to place it
            after; `0` places it first.

    Job:
      type: object
      additionalProperties: false
      required: [name, title, description, schedules]
      properties:
        name:
          type: string
          description: Stable id of the job, used in its paths.
          examples: [scan-notes]
        title:
          type: string
          examples: [Scan notes]
        description:
          type: string
        schedules:
          type: array
          description: The caller's tenant's schedules of the job, oldest first.
          items:
            $ref: '#/components/schemas/JobSchedule'

    JobList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Job'

    JobSchedule:
      type: object
      additionalProperties: false
      required: [id, cron, enabled, createdAt, updatedAt]
      properties:
        id:
          type: string
        cron:
          type: string
          description: >
            The cron expression in its stored 6-field form (seconds first): a
            5-field `0 3 * * *` is stored as `0 0 3 * * *`.
          examples: ['0 0 3 * * *']
        enabled:
          type: boolean
          description: A disabled schedule is kept but does not fire.
        nextRunAt:
          type: string
          format: date-time
          description: When it fires next; absent while it is disabled.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JobScheduleInput:
      type: object
      additionalProperties: false
      required: [cron]
      properties:
        cron:
          type: string
          description: >
            A 5-field Unix (`min hour dom month dow`) or 6-field Quartz (seconds
            first) cron expression, in the server's time zone. It may fire at
            most once a minute: the seconds field of a 6-field expression must be
            one number.
          minLength: 1
          maxLength: 100
          examples: ['0 3 * * *']
        enabled:
          type: boolean
          default: true

    JobSchedulePatch:
      type: object
      additionalProperties: false
      description: >
        Every field is optional; an absent one is left as it is. A `null` field
        counts as absent.
      properties:
        cron:
          type: string
          description: As in `JobScheduleInput.cron`.
          minLength: 1
          maxLength: 100
        enabled:
          type: boolean

    JobRun:
      type: object
      additionalProperties: false
      required: [id, job, status, queuedAt]
      properties:
        id:
          type: string
        job:
          type: string
          description: Name of the job (`Job.name`).
        status:
          type: string
          description: >
            `cancel_error` is a run that did not stop in time after a cancel; it
            ends with the status its own return gives.
          enum: [waiting, running, complete, failed, panicked, canceled, cancel_error]
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          description: Absent until the run starts.
        endedAt:
          type: string
          format: date-time
          description: Absent until the run ends.
        progress:
          $ref: '#/components/schemas/JobProgress'

    JobProgress:
      type: object
      additionalProperties: false
      description: The latest progress of a running run; absent on the others.
      required: [done, total]
      properties:
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: Units of work of the current step; `0` when it has no known size.
        stage:
          type: string
          description: What the run is doing now.

    JobRunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JobRun'

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: Opaque URI identifying the problem type; its last path segment is a stable slug.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Human readable explanation; omitted in production mode.
        instance:
          type: string
          description: Path of the request that failed.
        reference:
          type: string
          description: Correlation id of the request, when available.

    ValidationProblem:
      description: A problem with the list of fields that failed validation.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [pointer, detail]
                properties:
                  pointer:
                    type: string
                    description: JSON pointer (RFC 6901) to the failing field, e.g. `/title`.
                  detail:
                    type: string

  responses:
    BadRequest:
      description: >
        The request is malformed: the body is not one JSON object of the
        expected shape, or a query parameter is not of its declared type.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationError:
      description: >
        The request is well-formed but breaks a business rule. `errors` points
        at the field that broke it; the server currently stops at the first
        one.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    Unauthorized:
      description: >
        The caller is not authenticated: no identity was asserted, or it came
        from an untrusted peer.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TagNameTaken:
      description: A sibling of the tag already has that name.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NoteOrTagNotFound:
      description: The note or the tag does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    QueueFull:
      description: The server's job queue is full; try again later.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Internal:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
