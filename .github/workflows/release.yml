name: release
on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write
  packages: write   # push the container image to ghcr.io

jobs:
  # ===========================================================================
  # Linux + Windows (runs on Ubuntu, creates the GitHub release)
  # ===========================================================================
  linux:
    name: linux + windows
    runs-on: ubuntu-latest
    # Pure-Go builds (CGO_ENABLED=0 in .goreleaser.yaml) produce static binaries
    # with no glibc floor, so the runner image does not constrain which
    # distributions the artifacts run on and no cross-compilers are needed.
    env:
      CGO_ENABLED: 0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      # Builds the SPA into app/spa/files/ui (embedded by every binary) and
      # leaves webui/dist for the refapp-spa.zip archive.
      - name: Build frontend
        run: make package-ui

      # The container image (dockers_v2) is multi-arch; QEMU runs the arm64
      # stage's `apk add` on the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # macOS (runs on macOS, appends to the existing release)
  # ===========================================================================
  darwin:
    name: macos
    needs: linux
    runs-on: macos-latest
    env:
      CGO_ENABLED: 0

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json

      - name: Build frontend
        run: make package-ui

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser-darwin.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
